<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualification des données de comptage</title>
    <style>
      /* Shown the instant this page's markup paints — before the JS module
         below has even been fetched, let alone parsed and run — so the
         desktop app's native window never shows a blank white screen while
         it starts up. main.tsx removes #initial-loader right after React's
         first render, once the app has its own content (or its own,
         smaller "Chargement…" states) on screen. Inlined as plain CSS,
         not a Tailwind class, so it doesn't depend on the bundled
         stylesheet having loaded first. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
      }
      #initial-loader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #eef4fb;
        border-top-color: #1d4b7c;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" aria-hidden="true"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
