name: Build standalone desktop executable

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the "desktop-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release edit desktop-latest --target "$GITHUB_SHA" \
              --notes "Build automatique depuis le commit $GITHUB_SHA"
          else
            gh release create desktop-latest --target "$GITHUB_SHA" \
              --title "Exécutable desktop (dernière version)" \
              --notes "Build automatique depuis le commit $GITHUB_SHA"
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend build into the backend bundle
        shell: bash
        run: |
          rm -rf backend/frontend_dist
          cp -r frontend/dist backend/frontend_dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the executable
        working-directory: backend
        shell: bash
        run: |
          SEP=";"
          if [ "${{ runner.os }}" != "Windows" ]; then SEP=":"; fi
          pyinstaller --onefile --name QualifComptage \
            --add-data "frontend_dist${SEP}frontend_dist" \
            --collect-all pandas \
            --collect-all numpy \
            --collect-submodules uvicorn \
            --hidden-import multipart \
            desktop_main.py

      - name: Rename artifact per OS and upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="QualifComptage-Windows.exe"
            mv QualifComptage.exe "$asset"
          else
            asset="QualifComptage-Linux"
            mv QualifComptage "$asset"
          fi
          gh release upload desktop-latest "$asset" --clobber
